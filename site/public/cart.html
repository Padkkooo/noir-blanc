<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина — Noir&Blanc</title>
<link rel="stylesheet" href="style.css">
<style>
#back-to-top-noir{position:fixed;right:26px;bottom:26px;z-index:9999;width:48px;height:48px;border:1px solid rgba(255,255,255,.75);border-radius:50%;background:linear-gradient(145deg,#292929,#050505);color:#fff;font-size:24px;line-height:1;box-shadow:0 8px 24px rgba(0,0,0,.22);cursor:pointer;display:flex;align-items:center;justify-content:center;opacity:0;visibility:hidden;transform:translateY(12px);transition:opacity .25s ease,transform .25s ease,visibility .25s ease,background .2s ease}
#back-to-top-noir.visible{opacity:1;visibility:visible;transform:translateY(0)}
#back-to-top-noir:hover{background:linear-gradient(145deg,#555,#171717);transform:translateY(-3px)}
#back-to-top-noir:focus-visible{outline:3px solid #c8a878;outline-offset:4px}
@media(max-width:600px){#back-to-top-noir{right:16px;bottom:16px;width:44px;height:44px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}#back-to-top-noir{transition:none}}
</style>
</head>
<body>
<header class="header">
<h1 class="logo">Noir&Blanc</h1>
<input type="checkbox" id="menu-toggle">
<label for="menu-toggle" class="burger"><span></span><span></span><span></span></label>
<nav class="nav">
<a href="index.html">Главная</a>
<a href="price.html">Услуги и цены</a>
<a href="parfum.html">Парфюм</a>
<a href="contact.html">Контакты</a>

<a href="question.html">Вопросы - ответы</a>
<a href="order-history.html">История заказов</a>
<a href="cart.html" class="cart-link">Корзина <span id="cart-count">0</span></a>
<a href="login.html" class="profile-link is-guest" data-auth-link aria-label="Авторизация" title="Авторизация"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10Zm0 2c-4.42 0-8 2.24-8 5v1h16v-1c0-2.76-3.58-5-8-5Z"/></svg><span class="profile-text">Авторизация</span></a>
</nav>
</header>
<main class="cart-container">
<h2>Корзина</h2><p class="cart-subtitle">Ваши выбранные ароматы</p>
<section class="cart-layout">
    <div class="cart-items" id="cart-items"></div>
<aside class="cart-summary">
    <h3>Итого</h3>
    <div class="summary-row">
    <span>Товары</span><strong id="cart-total">0 ₽</strong></div>
    <div class="summary-row">
        <span>Доставка</span>
        <span>Рассчитывается отдельно</span></div>
        <div class="summary-divider">

        </div>
        <a class="checkout-btn" href="checkout.html">Оформить заказ</a>
        <a class="continue-shopping" href="parfum.html">← Вернуться к парфюмерии</a>
    </aside>
</section>
</main>
<footer><p>© 2025 - Noir&Blanc</p></footer>
<script src="api.js"></script>
<script src="auth.js"></script>
<script src="cart.js"></script>
<button id="back-to-top-noir" type="button" aria-label="Вернуться наверх" title="Наверх">↑</button>
<script>
(function(){
 const btn=document.getElementById('back-to-top-noir');
 if(!btn) return;
 const update=()=>btn.classList.toggle('visible',window.scrollY>300);
 window.addEventListener('scroll',update,{passive:true});
 update();
 btn.addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
})();
</script>
</body></html>
